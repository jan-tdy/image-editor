site_name: PyView Editor
site_description: A fast, IrfanView-style image and video viewer/editor with batch tools and Photo Triage.
site_url: https://jan-tdy.github.io/image-editor/
repo_url: https://github.com/jan-tdy/image-editor
repo_name: jan-tdy/image-editor
edit_uri: edit/main/docs/
copyright: © jan-tdy

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle: {icon: material/weather-night, name: Switch to dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle: {icon: material/weather-sunny, name: Switch to light mode}
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.keys

nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
  - Using PyView:
      - Viewer & editor: viewer.md
      - Photo Triage: triage.md
      - Batch Rename & Edit: batch.md
      - Join Images: join.md
      - Auto-Stack: autostack.md
  - Reference:
      - Keyboard shortcuts: shortcuts.md
      - Development: development.md
